<div style="display: flex; gap: 16px; background-color: transparent; border: 1px solid #3d4144; border-radius: 4px; padding: 16px; max-width: 550px; font-family: -apple-system, BlinkMacSystemFont, 'Roboto', 'Segoe UI', Arial, sans-serif; align-items: center;">
  
  <!-- Left Side: Locked Small Square Image (Will not balloon) -->
  <div style="flex-shrink: 0; width: 120px; height: 120px; border-radius: 4px; border: 1px solid #3d4144; overflow: hidden; background-color: #222526;">
    <img src="{% if site.posts.first.cover_img %}{{ site.posts.first.cover_img | relative_url }}{% else %}/assets/images/default-teaser.jpg{% endif %}" 
         alt="{{ site.posts.first.title }}" 
         style="width: 100%; height: 100%; object-fit: cover; display: block;" />
  </div>

  <!-- right content box -->
  <div style="flex-grow: 1; min-width: 0;">
    <!--meta text -->
    <span style="font-size: 0.72rem; color: #8a9296; font-weight: bold; text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 2px; line-height: 1.2;">
      Latest Post • {{ site.posts.first.date | date: "%B %d, %Y" }}
    </span>
    
    <!-- Post Title Heading -->
    <h3 style="margin: 0 0 4px 0 !important; padding: 0 !important; font-size: 1.15rem; font-weight: bold; line-height: 1.3;">
      <a href="{{ site.posts.first.url }}" style="color: #2af5ff; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s ease-in-out;" onmouseover="this.style.borderBottomColor='#2af5ff'" onmouseout="this.style.borderBottomColor='transparent'">
        {{ site.posts.first.title }}
      </a>
    </h3>

    <!-- Excerpt Snippet -->
    <p style="margin: 0 !important; padding: 0 !important; font-size: 0.85rem; color: #b5b5b5; line-height: 1.4; word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
      {{ site.posts.first.excerpt | strip_html }}
    </p>
  </div>

</div>
